services:
  chromium-gpt:
    container_name: chromium-gpt
    image: ghcr.nju.edu.cn/al-one/chrome:codex
    pull_policy: always
    ports:
      - "18083:8080"
    volumes:
      - ./chromium:/root/.config/chromium
    environment:
      VNC_PASS: ${VNC_PASS:-CHANGE_IT}
      VNC_RESOLUTION: ${VNC_RESOLUTION:-1440x880}
      TZ: Asia/Shanghai
    shm_size: 2gb
    restart: always
